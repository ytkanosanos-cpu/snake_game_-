<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка</title>
<style>
  :root {
    --bg: #12161c;
    --panel: #1b2129;
    --grid: #222a34;
    --text: #e6edf3;
    --muted: #8b98a5;
    --snake: #4ade80;
    --head: #22c55e;
    --food: #f87171;
    --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
  }
  h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: 1px; }
  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 18px;
  }
  .hud span b { color: var(--accent); }
  .wrap { position: relative; }
  canvas {
    display: block;
    background: var(--panel);
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    max-width: calc(100vw - 32px);
    height: auto;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(18,22,28,.82);
    border-radius: 10px;
    text-align: center;
    gap: 10px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 30px; }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    margin-top: 8px;
    padding: 10px 22px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: var(--head);
    color: #0b1410;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .help { margin-top: 14px; color: var(--muted); font-size: 14px; text-align: center; }
  .pad {
    display: none;
    margin-top: 14px;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
  }
  .pad button { margin: 0; padding: 0; font-size: 22px; background: var(--grid); color: var(--text); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (hover: none) { .pad { display: grid; } }
</style>
</head>
<body>
  <h1>🐍 Змейка</h1>
  <div class="hud">
    <span>Счёт: <b id="score">0</b></span>
    <span>Рекорд: <b id="best">0</b></span>
  </div>
  <div class="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Змейка</h2>
      <p id="ovText">Стрелки или WASD — управление</p>
      <button id="startBtn">Играть</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <div class="help">Стрелки / WASD — движение · Пробел — пауза · Enter — начать заново</div>

<script>
(() => {
  const CELL = 20;
  const COLS = 20;
  const ROWS = 20;
  const START_SPEED = 130; // мс на шаг
  const MIN_SPEED = 60;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
  };

  let snake, dir, queue, food, score, best, speed, timer, state;

  best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function start() {
    reset();
    state = 'playing';
    hideOverlay();
    loop();
  }

  function loop() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (state !== 'playing') return;
      step();
      draw();
      if (state === 'playing') loop();
    }, speed);
  }

  function step() {
    // Берём следующий направляемый ход из очереди (позволяет быстрые повороты)
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();

    const eating = food && head.x === food.x && head.y === food.y;
    // Хвост сдвинется, если не едим — значит в клетку хвоста можно заходить
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, START_SPEED - score * 3);
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    showOverlay('Игра окончена', 'Счёт: ' + score, 'Ещё раз');
  }

  function win() {
    state = 'over';
    best = Math.max(best, score);
    bestEl.textContent = best;
    try { localStorage.setItem('snake-best', best); } catch (e) {}
    showOverlay('Победа! 🎉', 'Змейка заняла всё поле', 'Ещё раз');
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      clearTimeout(timer);
      showOverlay('Пауза', 'Пробел — продолжить', 'Продолжить');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      loop();
    }
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function turn(name) {
    if (state !== 'playing') return;
    const next = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (next === last) return;
    if (next.x === -last.x && next.y === -last.y) return; // разворот на 180° запрещён
    if (queue.length < 3) queue.push(next);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.fillStyle = '#1b2129';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Сетка в шахматном порядке
    ctx.fillStyle = '#1f262f';
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if ((x + y) % 2) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // Еда
    if (food) {
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Змейка
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
    });

    // Глаза
    const h = snake[0];
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const px = -dir.y, py = dir.x; // перпендикуляр
    ctx.fillStyle = '#0b1410';
    [1, -1].forEach(side => {
      ctx.beginPath();
      ctx.arc(cx + dir.x * 4 + px * 4 * side, cy + dir.y * 4 + py * 4 * side, 2, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  const KEYS = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
  };

  document.addEventListener('keydown', e => {
    if (KEYS[e.code]) {
      e.preventDefault();
      turn(KEYS[e.code]);
    } else if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
    } else if (e.code === 'Enter') {
      e.preventDefault();
      if (state !== 'playing') start();
    }
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });

  document.querySelectorAll('.pad button').forEach(b =>
    b.addEventListener('click', () => turn(b.dataset.dir)));

  // Свайпы на сенсорных экранах
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20)
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touchStart = null;
  });

  // Тестовый доступ к состоянию (не влияет на игру)
  window.__snake = {
    get state() { return state; },
    get snake() { return snake; },
    get food() { return food; },
    get score() { return score; },
    setFood(x, y) { food = { x, y }; draw(); },
  };

  state = 'idle';
  reset();
  draw();
})();
</script>
</body>
</html>
